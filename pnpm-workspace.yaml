packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks dependency lifecycle scripts by default. These packages need
# theirs to fetch or compile binaries; without the allowlist Prisma ships no
# query engine, which makes `prisma generate` recurse into `pnpm add`.
# Deliberately excluded: @biomejs/biome (unused).
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
  - sharp
  - youtube-dl-exec
  - bufferutil
  - utf-8-validate
  - msgpackr-extract
  - '@parcel/watcher'
  - unrs-resolver
