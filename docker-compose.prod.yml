version: '3.9'

services:
  postgres:
    container_name: deciball-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deciball}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-deciball}
    volumes:
      - deciball-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deciball}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deciball

  redis:
    container_name: deciball-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - deciball-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - deciball

  web:
    container_name: deciball-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    env_file:
      - apps/web/.env.production
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - deciball

  ws:
    container_name: deciball-ws
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    restart: always
    env_file:
      - apps/ws/.env.production
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - deciball

volumes:
  deciball-pgdata:
  deciball-redisdata:

networks:
  deciball:
    driver: bridge
