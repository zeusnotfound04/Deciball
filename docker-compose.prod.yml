# Production stack. Run through deploy/deploy.sh, which generates the env files below.
#   .env                        compose interpolation: Postgres/Redis passwords, host ports
#   apps/web/.env.production    web + migrate runtime env; also read by `next build`
#   apps/ws/.env.production     ws runtime env
name: deciball

services:
  postgres:
    container_name: deciball-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deciball}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-deciball}
    volumes:
      - deciball-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deciball} -d ${POSTGRES_DB:-deciball}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - deciball

  redis:
    container_name: deciball-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    volumes:
      - deciball-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - deciball

  # The web runner is a Next.js standalone bundle with no Prisma CLI, so migrations run
  # from the deps stage, which has the full install. `migrate deploy` is idempotent and
  # runs on every `up`; web does not start unless it exits 0.
  migrate:
    container_name: deciball-migrate
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    env_file:
      - apps/web/.env.production
    working_dir: /app/packages/database
    command: ["/app/node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - deciball

  web:
    container_name: deciball-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    env_file:
      - apps/web/.env.production
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - deciball

  ws:
    container_name: deciball-ws
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    restart: always
    env_file:
      - apps/ws/.env.production
    ports:
      - "127.0.0.1:${WS_HOST_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - deciball

volumes:
  deciball-pgdata:
  deciball-redisdata:

networks:
  deciball:
    driver: bridge
